name: render terminal

on:
  push:
    branches: [main]
    paths:
      - "terminal/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Chinese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-jetbrains-mono

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install puppeteer
        run: |
          cd terminal
          npm init -y >/dev/null
          npm install puppeteer

      - name: Render terminal.html to SVG + PNG
        run: |
          cd terminal
          node render.js

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: terminal/dist
          keep_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
