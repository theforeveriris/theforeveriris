name: render terminal and snake

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
    paths:
      - "terminal/**"
      - "img/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # terminal svg
      - name: Build terminal.svg
        run: |
          cd terminal
          npm init -y >/dev/null
          node build-svg.js

      # snake
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            terminal/dist/github-contribution-grid-snake.svg
            terminal/dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: terminal/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
